<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ♥</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:monospace;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

/* DARK VIGNETTE */
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:100;
  box-shadow:inset 0 0 160px 60px #000;
}

/* NOISE */
.noise{
  position:fixed;
  inset:-50%;
  opacity:.05;
  pointer-events:none;
  background-image:
    repeating-radial-gradient(
      circle,
      #fff 0 1px,
      transparent 1px 3px
    );
  animation:noise .12s infinite;
}

@keyframes noise{
  0%{transform:translate(0,0)}
  25%{transform:translate(3%,-2%)}
  50%{transform:translate(-2%,3%)}
  75%{transform:translate(1%,2%)}
}

/* ================= INTRO ================= */

.intro{
  position:fixed;
  inset:0;
  z-index:150;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:#000;
  padding:25px;
}

.intro.hide{
  animation:fadeOut 1.4s forwards;
}

@keyframes fadeOut{
  to{
    opacity:0;
    visibility:hidden;
  }
}

.warning{
  color:#8d0000;
  font-size:11px;
  letter-spacing:6px;
  margin-bottom:25px;
  min-height:15px;
}

#introTitle{
  font-size:26px;
  font-weight:400;
  letter-spacing:4px;
}

#introTitle.romana{
  color:#fff;
  font-size:38px;
  letter-spacing:9px;
  text-shadow:0 0 20px rgba(255,255,255,.15);
}

#introSub{
  margin-top:20px;
  color:#888;
  font-size:11px;
  letter-spacing:3px;
  line-height:1.8;
}

/* OPEN BUTTON */

#openBtn{
  margin-top:40px;
  padding:14px 34px;

  color:#eee;
  background:transparent;

  border:1px solid #555;
  border-radius:30px;

  font-family:monospace;
  font-size:12px;
  letter-spacing:3px;

  cursor:pointer;

  transition:.3s;

  position:relative;
  z-index:200;
}

#openBtn:hover{
  border-color:#999;
  box-shadow:0 0 20px rgba(255,255,255,.1);
}

#openBtn:active{
  transform:scale(.93);
}

/* FLICKER AFTER OPEN */

.horrorTitle{
  color:#a00000 !important;
  text-shadow:
    0 0 10px #700000,
    0 0 30px #400000 !important;

  animation:flicker .22s infinite;
}

@keyframes flicker{
  0%{opacity:1}
  15%{opacity:.3}
  25%{opacity:1}
  50%{opacity:.7}
  55%{opacity:.1}
  65%{opacity:1}
  100%{opacity:.9}
}

/* ================= ROOM ================= */

.room{
  position:fixed;
  inset:0;
  opacity:0;

  background:
    radial-gradient(
      circle at 50% 45%,
      #170000 0%,
      #060000 23%,
      #000 62%
    );

  transition:opacity 2s;
}

.room.show{
  opacity:1;
}

/* FOG */

.fog{
  position:absolute;
  width:200%;
  height:40%;
  left:-50%;
  bottom:0;

  opacity:.15;
  filter:blur(30px);

  background:
    radial-gradient(
      ellipse,
      #777 0%,
      transparent 60%
    );

  animation:fog 10s linear infinite;
}

@keyframes fog{
  from{transform:translateX(-15%)}
  to{transform:translateX(15%)}
}

/* ================= EYES ================= */

.eyes{
  position:absolute;
  top:37%;
  left:50%;

  transform:
    translate(-50%,-50%)
    scale(.7);

  display:flex;
  gap:70px;

  opacity:0;

  transition:
    opacity 2s,
    transform 4s;
}

.eyes.show{
  opacity:1;

  transform:
    translate(-50%,-50%)
    scale(1.2);
}

.eye{
  width:38px;
  height:13px;

  background:#b00000;

  border-radius:
    70% 20% 70% 20%;

  box-shadow:
    0 0 10px red,
    0 0 25px #c00000,
    0 0 55px #700000;

  animation:eyeGlow 1.5s infinite alternate;
}

.eye:nth-child(2){
  transform:scaleX(-1);
}

@keyframes eyeGlow{
  from{
    filter:brightness(.6);
  }

  to{
    filter:brightness(1.5);
  }
}

/* ================= MESSAGE ================= */

.message{
  position:absolute;
  top:60%;
  width:100%;

  text-align:center;

  color:#8c0000;

  font-size:15px;
  letter-spacing:5px;

  opacity:0;
}

.message.show{
  animation:glitchShow .35s infinite;
}

@keyframes glitchShow{
  0%{
    opacity:.4;
    transform:translate(0);
  }

  25%{
    opacity:1;
    transform:translate(-4px,2px);
  }

  50%{
    transform:translate(5px,-2px);
  }

  75%{
    transform:translate(-2px,-3px);
  }

  100%{
    opacity:.7;
    transform:translate(0);
  }
}

/* ================= COUNTDOWN ================= */

.count{
  position:fixed;
  font-size:110px;
  color:#790000;
  opacity:0;
  z-index:180;

  text-shadow:
    0 0 15px red,
    0 0 40px #800000;
}

/* ================= JUMPSCARE ================= */

.scare{
  position:fixed;
  inset:0;
  z-index:300;

  display:none;

  background:#000;

  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.scare.active{
  display:flex;
  animation:screenShake .06s infinite;
}

.face{
  position:relative;

  width:330px;
  height:430px;

  border-radius:
    48% 48% 42% 42%;

  background:
    radial-gradient(
      circle at 50% 35%,
      #eee 0%,
      #777 28%,
      #111 70%
    );

  filter:contrast(1.8);

  animation:attack .22s infinite alternate;
}

@keyframes attack{
  from{
    transform:scale(1.15) rotate(-3deg);
  }

  to{
    transform:scale(1.65) rotate(3deg);
  }
}

.face::before,
.face::after{
  content:"";

  position:absolute;
  top:125px;

  width:75px;
  height:55px;

  border-radius:50%;

  background:#020000;

  box-shadow:
    inset 0 0 15px #000,
    0 0 30px #b00000;
}

.face::before{
  left:48px;
}

.face::after{
  right:48px;
}

.pupil1,
.pupil2{
  position:absolute;

  top:143px;

  width:15px;
  height:15px;

  background:red;

  border-radius:50%;

  z-index:5;

  box-shadow:
    0 0 20px red,
    0 0 45px #a00000;
}

.pupil1{
  left:78px;
}

.pupil2{
  right:78px;
}

.mouth{
  position:absolute;

  left:50%;
  bottom:60px;

  transform:translateX(-50%);

  width:160px;
  height:120px;

  background:#000;

  border-radius:
    15% 15% 50% 50%;

  overflow:hidden;
}

.teeth{
  position:absolute;
  width:100%;
  top:0;

  display:flex;
  justify-content:center;
}

.tooth{
  width:25px;
  height:45px;

  background:#ddd;

  clip-path:
    polygon(
      0 0,
      100% 0,
      50% 100%
    );
}

/* FLASH */

.flash{
  position:fixed;
  inset:0;

  background:#fff;

  opacity:0;

  pointer-events:none;

  z-index:400;
}

.flash.active{
  animation:flash .55s;
}

@keyframes flash{
  0%{
    opacity:1;
  }

  20%{
    opacity:0;
  }

  40%{
    opacity:.9;
    background:red;
  }

  60%{
    opacity:0;
  }

  75%{
    opacity:.5;
    background:#fff;
  }

  100%{
    opacity:0;
  }
}

@keyframes screenShake{
  0%{
    transform:translate(-9px,6px);
  }

  25%{
    transform:translate(9px,-8px);
  }

  50%{
    transform:translate(-6px,-7px);
  }

  75%{
    transform:translate(8px,8px);
  }

  100%{
    transform:translate(-4px,3px);
  }
}

/* ================= END ================= */

.end{
  position:fixed;
  inset:0;
  z-index:500;

  display:none;

  justify-content:center;
  align-items:center;
  flex-direction:column;

  background:#000;

  text-align:center;
}

.end.show{
  display:flex;
  animation:endShow 1.2s;
}

.end h1{
  color:#b00000;

  font-size:35px;
  letter-spacing:5px;

  text-shadow:
    0 0 25px red;
}

.end p{
  margin-top:20px;

  color:#777;

  letter-spacing:4px;

  font-size:11px;
}

.heart{
  margin-top:25px;

  color:#c00000;

  font-size:35px;

  animation:heartAnimation .8s infinite;
}

@keyframes heartAnimation{
  50%{
    transform:scale(1.35);
    text-shadow:0 0 30px red;
  }
}

@keyframes endShow{
  from{opacity:0}
  to{opacity:1}
}

</style>
</head>

<body>

<div class="noise"></div>

<!-- FIRST SCREEN -->

<div class="intro" id="intro">

  <div class="warning" id="warning"></div>

  <h1 id="introTitle" class="romana">
    ROMANA...
  </h1>

  <p id="introSub">
    I MADE SOMETHING FOR YOU.
  </p>

  <button id="openBtn">
    OPEN IT ♥
  </button>

</div>

<!-- DARK ROOM -->

<div class="room" id="room">

  <div class="fog"></div>

  <div class="eyes" id="eyes">
    <div class="eye"></div>
    <div class="eye"></div>
  </div>

  <div class="message" id="message">
    IT CAN SEE YOU
  </div>

</div>

<!-- COUNTDOWN -->

<div class="count" id="count"></div>

<!-- JUMPSCARE -->

<div class="scare" id="scare">

  <div class="face">

    <div class="pupil1"></div>
    <div class="pupil2"></div>

    <div class="mouth">

      <div class="teeth">
        <div class="tooth"></div>
        <div class="tooth"></div>
        <div class="tooth"></div>
        <div class="tooth"></div>
        <div class="tooth"></div>
      </div>

    </div>

  </div>

</div>

<div class="flash" id="flash"></div>

<!-- END -->

<div class="end" id="end">

  <h1>SORRY ROMANA 😂</h1>

  <p>
    YOU SURVIVED.
  </p>

  <div class="heart">
    ♥
  </div>

</div>

<script>

const intro =
  document.getElementById("intro");

const warning =
  document.getElementById("warning");

const introTitle =
  document.getElementById("introTitle");

const introSub =
  document.getElementById("introSub");

const openBtn =
  document.getElementById("openBtn");

const room =
  document.getElementById("room");

const eyes =
  document.getElementById("eyes");

const message =
  document.getElementById("message");

const count =
  document.getElementById("count");

const scare =
  document.getElementById("scare");

const flash =
  document.getElementById("flash");

const end =
  document.getElementById("end");


/* ==========================
   AUDIO
========================== */

let audioCtx;

function audio(){

  if(!audioCtx){

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

}


/* HEARTBEAT */

function heartbeat(){

  audio();

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  osc.type="sine";

  osc.frequency.setValueAtTime(
    58,
    audioCtx.currentTime
  );

  osc.frequency.exponentialRampToValueAtTime(
    42,
    audioCtx.currentTime+.2
  );

  gain.gain.setValueAtTime(
    .001,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .42,
    audioCtx.currentTime+.02
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+.24
  );

  osc.connect(gain);

  gain.connect(
    audioCtx.destination
  );

  osc.start();

  osc.stop(
    audioCtx.currentTime+.25
  );

}


/* JUMPSCARE SOUND */

function scream(){

  audio();

  const duration=1.5;

  const buffer =
    audioCtx.createBuffer(
      1,
      audioCtx.sampleRate*duration,
      audioCtx.sampleRate
    );

  const data =
    buffer.getChannelData(0);

  for(
    let i=0;
    i<data.length;
    i++
  ){

    const fade =
      1-(i/data.length);

    data[i] =
      (Math.random()*2-1)
      * fade;

  }

  const source =
    audioCtx.createBufferSource();

  source.buffer=buffer;

  const filter =
    audioCtx.createBiquadFilter();

  filter.type="bandpass";

  filter.frequency.setValueAtTime(
    1800,
    audioCtx.currentTime
  );

  filter.frequency.exponentialRampToValueAtTime(
    500,
    audioCtx.currentTime+1.3
  );

  filter.Q.value=.8;

  const gain =
    audioCtx.createGain();

  gain.gain.setValueAtTime(
    .75,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .01,
    audioCtx.currentTime+1.5
  );

  source.connect(filter);

  filter.connect(gain);

  gain.connect(
    audioCtx.destination
  );

  source.start();

}


/* ==========================
   START AFTER BUTTON TAP
========================== */

let started=false;
let beat;


/*
 IMPORTANT:
 Audio is unlocked directly
 from the OPEN IT button tap.
*/

openBtn.addEventListener(
  "click",
  async ()=>{

    if(started) return;

    started=true;

    audio();

    if(
      audioCtx.state==="suspended"
    ){

      await audioCtx.resume();

    }


    /* Hide button */

    openBtn.style.display="none";


    /*
      First tiny heartbeat.
      This happens from the tap,
      helping keep audio active.
    */

    heartbeat();


    /* CHANGE MESSAGE */

    introTitle.classList.remove(
      "romana"
    );

    introTitle.classList.add(
      "horrorTitle"
    );

    introTitle.innerHTML =
      "ROMANA...";

    introSub.innerHTML =
      "YOU SHOULDN'T HAVE OPENED IT.";


    /* WARNING */

    setTimeout(()=>{

      warning.innerHTML =
        "⚠ WARNING ⚠";

      introTitle.innerHTML =
        "DON'T LOOK BEHIND YOU.";

      introSub.innerHTML =
        "Something is already here...";

    },2200);


    /* DARK ROOM */

    setTimeout(()=>{

      intro.classList.add(
        "hide"
      );

      room.classList.add(
        "show"
      );

    },5200);


    /* EYES */

    setTimeout(()=>{

      eyes.classList.add(
        "show"
      );

    },7200);


    /* HEARTBEAT */

    setTimeout(()=>{

      heartbeat();

      beat =
        setInterval(
          heartbeat,
          850
        );

    },7500);


    /* MESSAGE */

    setTimeout(()=>{

      message.classList.add(
        "show"
      );

    },9000);


    /* COUNTDOWN */

    setTimeout(()=>{

      count.style.opacity=1;

      let n=3;

      count.innerText=n;

      heartbeat();

      const timer =
        setInterval(()=>{

          n--;

          if(n>0){

            count.innerText=n;

            heartbeat();

          }

          else{

            clearInterval(timer);

            clearInterval(beat);

            count.style.opacity=0;

            jumpscare();

          }

        },800);

    },10800);

  }
);


/* ==========================
   JUMPSCARE
========================== */

function jumpscare(){

  scare.classList.add(
    "active"
  );

  flash.classList.add(
    "active"
  );


  /* SCREAM */

  scream();


  /* VIBRATION */

  if(navigator.vibrate){

    navigator.vibrate(
      [
        180,
        40,
        180,
        40,
        350
      ]
    );

  }


  /* SHOW END */

  setTimeout(()=>{

    scare.classList.remove(
      "active"
    );

    end.classList.add(
      "show"
    );

  },1900);

}

</script>

</body>
</html>
