<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You...</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:white;
  font-family:monospace;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

/* VIGNETTE */
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:500;
  box-shadow:inset 0 0 150px 50px #000;
}

/* NOISE */
.noise{
  position:fixed;
  inset:-40%;
  opacity:.04;
  pointer-events:none;
  background-image:
    repeating-radial-gradient(
      circle,
      #fff 0 1px,
      transparent 1px 4px
    );
  animation:noise .15s infinite;
}

@keyframes noise{
  0%{transform:translate(0,0)}
  25%{transform:translate(2%,-2%)}
  50%{transform:translate(-2%,2%)}
  75%{transform:translate(2%,1%)}
}

/* =========================
   FIRST SCREEN
========================= */

.intro{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:#000;
  padding:25px;
}

.intro.hide{
  animation:introHide 1.3s forwards;
}

@keyframes introHide{
  to{
    opacity:0;
    visibility:hidden;
  }
}

.intro h1{
  font-size:30px;
  letter-spacing:7px;
  font-weight:400;
  margin-bottom:18px;
}

.intro p{
  color:#888;
  font-size:13px;
  letter-spacing:3px;
  line-height:1.8;
}

.openBtn{
  margin-top:45px;
  padding:15px 35px;
  border:1px solid #8d1c1c;
  border-radius:30px;
  background:transparent;
  color:#ddd;
  font-family:monospace;
  letter-spacing:4px;
  font-size:12px;
  cursor:pointer;
  box-shadow:0 0 20px rgba(150,0,0,.2);
}

.openBtn:active{
  transform:scale(.95);
}

/* =========================
   ROOM
========================= */

.room{
  position:fixed;
  inset:0;
  opacity:0;
  visibility:hidden;
  background:
    radial-gradient(
      circle at 50% 42%,
      #190000 0%,
      #080000 18%,
      #020000 42%,
      #000 72%
    );
  transition:opacity 1.5s;
}

.room.show{
  opacity:1;
  visibility:visible;
}

/* FOG */
.fog{
  position:absolute;
  width:180%;
  height:45%;
  left:-40%;
  bottom:-10%;
  opacity:.13;
  filter:blur(35px);
  background:
    radial-gradient(
      ellipse,
      #999 0%,
      transparent 65%
    );
  animation:fogMove 9s ease-in-out infinite alternate;
}

@keyframes fogMove{
  from{transform:translateX(-12%)}
  to{transform:translateX(12%)}
}

/* =========================
   EYES
========================= */

.eyes{
  position:absolute;
  top:38%;
  left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  gap:75px;
  opacity:0;
  transition:opacity 2.5s;
}

.eyes.show{
  opacity:.85;
}

.eye{
  width:42px;
  height:14px;
  background:#b00000;
  border-radius:80% 20% 80% 20%;
  box-shadow:
    0 0 10px #f00,
    0 0 30px #900,
    0 0 60px #500;
}

.eye:nth-child(2){
  transform:scaleX(-1);
}

/* =========================
   MESSAGE
========================= */

.message{
  position:absolute;
  top:61%;
  left:0;
  width:100%;
  text-align:center;
  color:#8d0000;
  font-size:15px;
  letter-spacing:6px;
  opacity:0;
}

.message.show{
  opacity:1;
  animation:messageGlitch .35s infinite;
}

@keyframes messageGlitch{
  0%{transform:translate(0)}
  30%{transform:translate(-2px,1px)}
  60%{transform:translate(2px,-1px)}
  100%{transform:translate(0)}
}

/* =========================
   COUNTDOWN
========================= */

.count{
  position:fixed;
  z-index:250;
  display:none;
  align-items:center;
  justify-content:center;
  inset:0;
  background:#000;
  color:#850000;
  font-size:110px;
  font-weight:bold;
  text-shadow:
    0 0 15px #f00,
    0 0 45px #700;
}

.count.show{
  display:flex;
}

.count.pop{
  animation:countPop .7s;
}

@keyframes countPop{
  0%{
    transform:scale(2);
    opacity:0;
  }
  30%{
    transform:scale(1);
    opacity:1;
  }
  100%{
    opacity:.7;
  }
}

/* =========================
   FAKE QUIET SCREEN
========================= */

.silence{
  position:fixed;
  inset:0;
  z-index:280;
  display:none;
  background:#000;
}

.silence.show{
  display:block;
}

/* =========================
   JUMPSCARE
========================= */

.scare{
  position:fixed;
  inset:0;
  z-index:400;
  display:none;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle,#420000,#000 65%);
  overflow:hidden;
}

.scare.active{
  display:flex;
  animation:shake .065s infinite;
}

/* MONSTER */
.face{
  position:relative;
  width:330px;
  height:430px;

  border-radius:
    48% 48%
    38% 38%;

  background:
    radial-gradient(
      circle at 50% 34%,
      #d5d5d5 0%,
      #777 24%,
      #252525 50%,
      #050505 78%
    );

  filter:
    contrast(1.8)
    brightness(.9);

  animation:attack .22s infinite alternate;
}

@keyframes attack{
  from{
    transform:
      scale(1.15)
      rotate(-2deg);
  }
  to{
    transform:
      scale(1.6)
      rotate(2deg);
  }
}

/* DARK EYE SOCKETS */
.face::before,
.face::after{
  content:"";
  position:absolute;
  top:115px;
  width:85px;
  height:65px;
  border-radius:55%;

  background:#000;

  box-shadow:
    inset 0 0 20px #000,
    0 0 20px #b00000,
    0 0 45px #500;
}

.face::before{
  left:38px;
  transform:rotate(10deg);
}

.face::after{
  right:38px;
  transform:rotate(-10deg);
}

/* PUPILS */

.pupil{
  position:absolute;
  top:139px;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#f00000;
  z-index:5;

  box-shadow:
    0 0 8px red,
    0 0 25px red;
}

.pupil.left{
  left:72px;
}

.pupil.right{
  right:72px;
}

/* NOSE */
.nose{
  position:absolute;
  top:205px;
  left:50%;
  transform:translateX(-50%);

  width:35px;
  height:55px;

  background:#090909;

  clip-path:
    polygon(
      50% 0,
      100% 100%,
      50% 80%,
      0 100%
    );
}

/* MOUTH */
.mouth{
  position:absolute;
  left:50%;
  bottom:48px;
  transform:translateX(-50%);

  width:180px;
  height:130px;

  background:#000;

  border-radius:
    15% 15%
    50% 50%;

  overflow:hidden;

  box-shadow:
    inset 0 0 20px #400,
    0 0 15px #500;
}

/* TEETH TOP */
.teethTop,
.teethBottom{
  position:absolute;
  width:100%;
  display:flex;
  justify-content:center;
}

.teethTop{
  top:0;
}

.teethBottom{
  bottom:0;
  transform:rotate(180deg);
}

.tooth{
  width:28px;
  height:45px;
  background:#ddd;

  clip-path:
    polygon(
      0 0,
      100% 0,
      50% 100%
    );
}

/* =========================
   RED FLASH
========================= */

.flash{
  position:fixed;
  inset:0;
  z-index:450;
  background:#b00000;
  opacity:0;
  pointer-events:none;
}

.flash.active{
  animation:oneFlash .35s;
}

@keyframes oneFlash{
  0%{opacity:.75}
  100%{opacity:0}
}

/* SCREEN SHAKE */
@keyframes shake{
  0%{transform:translate(-7px,5px)}
  25%{transform:translate(7px,-6px)}
  50%{transform:translate(-5px,-5px)}
  75%{transform:translate(6px,6px)}
  100%{transform:translate(0)}
}

/* =========================
   END
========================= */

.end{
  position:fixed;
  inset:0;
  z-index:600;
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:#000;
}

.end.show{
  display:flex;
  animation:endFade 1.2s;
}

.end h1{
  color:#b00000;
  font-size:36px;
  letter-spacing:7px;
  text-shadow:
    0 0 15px red,
    0 0 35px #700;
}

.end .emoji{
  font-size:55px;
  margin:20px 0;
}

.end p{
  color:#777;
  font-size:12px;
  letter-spacing:5px;
}

.end .heart{
  margin-top:35px;
  color:#d00000;
  font-size:50px;
  text-shadow:0 0 25px red;
  animation:heart 1s infinite;
}

@keyframes heart{
  50%{transform:scale(1.25)}
}

@keyframes endFade{
  from{opacity:0}
  to{opacity:1}
}
</style>
</head>

<body>

<div class="noise"></div>

<!-- FIRST SCREEN -->
<div class="intro" id="intro">

  <h1 id="introTitle">
    FRIEND...
  </h1>

  <p id="introText">
    I MADE SOMETHING FOR YOU.
  </p>

  <button
    class="openBtn"
    id="openBtn">
    OPEN IT ♥
  </button>

</div>


<!-- HORROR ROOM -->
<div class="room" id="room">

  <div class="fog"></div>

  <div
    class="eyes"
    id="eyes">

    <div class="eye"></div>
    <div class="eye"></div>

  </div>

  <div
    class="message"
    id="message">

    DON'T LOOK AWAY

  </div>

</div>


<!-- COUNTDOWN -->
<div
  class="count"
  id="count">
</div>


<!-- FAKE SILENCE -->
<div
  class="silence"
  id="silence">
</div>


<!-- JUMPSCARE -->
<div
  class="scare"
  id="scare">

  <div class="face">

    <div class="pupil left"></div>
    <div class="pupil right"></div>

    <div class="nose"></div>

    <div class="mouth">

      <div class="teethTop">
        <div class="tooth"></div>
        <div class="tooth"></div>
        <div class="tooth"></div>
        <div class="tooth"></div>
        <div class="tooth"></div>
        <div class="tooth"></div>
      </div>

      <div class="teethBottom">
        <div class="tooth"></div>
        <div class="tooth"></div>
        <div class="tooth"></div>
        <div class="tooth"></div>
        <div class="tooth"></div>
        <div class="tooth"></div>
      </div>

    </div>

  </div>

</div>


<div
  class="flash"
  id="flash">
</div>


<!-- END -->
<div
  class="end"
  id="end">

  <h1>
    SORRY FRIEND
  </h1>

  <div class="emoji">
    😂
  </div>

  <p>
    YOU SURVIVED.
  </p>

  <div class="heart">
    ♥
  </div>

</div>


<script>

/* ELEMENTS */

const intro =
  document.getElementById("intro");

const introTitle =
  document.getElementById("introTitle");

const introText =
  document.getElementById("introText");

const openBtn =
  document.getElementById("openBtn");

const room =
  document.getElementById("room");

const eyes =
  document.getElementById("eyes");

const message =
  document.getElementById("message");

const count =
  document.getElementById("count");

const silence =
  document.getElementById("silence");

const scare =
  document.getElementById("scare");

const flash =
  document.getElementById("flash");

const end =
  document.getElementById("end");


/* =========================
   AUDIO
========================= */

let audioCtx;
let heartbeatTimer;

function initAudio(){

  if(!audioCtx){

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

}


/* HEARTBEAT */

function heartbeat(){

  if(!audioCtx) return;

  const now =
    audioCtx.currentTime;

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  osc.type="sine";

  osc.frequency
    .setValueAtTime(
      58,
      now
    );

  osc.frequency
    .exponentialRampToValueAtTime(
      42,
      now+.18
    );

  gain.gain
    .setValueAtTime(
      .001,
      now
    );

  gain.gain
    .exponentialRampToValueAtTime(
      .28,
      now+.02
    );

  gain.gain
    .exponentialRampToValueAtTime(
      .001,
      now+.22
    );

  osc.connect(gain);

  gain.connect(
    audioCtx.destination
  );

  osc.start(now);

  osc.stop(
    now+.25
  );

}


/* SECOND HEARTBEAT */

function doubleHeartbeat(){

  heartbeat();

  setTimeout(
    heartbeat,
    190
  );

}


/* CREEPY LOW SOUND */

function drone(){

  if(!audioCtx) return;

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  const filter =
    audioCtx.createBiquadFilter();

  osc.type="sawtooth";
  osc.frequency.value=38;

  filter.type="lowpass";
  filter.frequency.value=110;

  gain.gain.value=.025;

  osc.connect(filter);

  filter.connect(gain);

  gain.connect(
    audioCtx.destination
  );

  osc.start();

  osc.stop(
    audioCtx.currentTime+12
  );

}


/* COUNT SOUND */

function countSound(){

  if(!audioCtx) return;

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  const now =
    audioCtx.currentTime;

  osc.type="square";
  osc.frequency.value=90;

  gain.gain
    .setValueAtTime(
      .10,
      now
    );

  gain.gain
    .exponentialRampToValueAtTime(
      .001,
      now+.18
    );

  osc.connect(gain);

  gain.connect(
    audioCtx.destination
  );

  osc.start(now);

  osc.stop(
    now+.2
  );

}


/* JUMPSCARE SOUND */

function scream(){

  if(!audioCtx) return;

  const duration=1.15;

  const buffer =
    audioCtx.createBuffer(
      1,
      audioCtx.sampleRate * duration,
      audioCtx.sampleRate
    );

  const data =
    buffer.getChannelData(0);

  for(
    let i=0;
    i<data.length;
    i++
  ){

    const fade =
      1 -
      (i/data.length);

    data[i] =
      (Math.random()*2-1)
      * fade;

  }

  const source =
    audioCtx.createBufferSource();

  source.buffer=buffer;

  const filter =
    audioCtx.createBiquadFilter();

  filter.type="bandpass";
  filter.frequency.value=950;
  filter.Q.value=.8;

  const gain =
    audioCtx.createGain();

  gain.gain.value=.38;

  source.connect(filter);

  filter.connect(gain);

  gain.connect(
    audioCtx.destination
  );

  source.start();

}


/* =========================
   START
========================= */

let started=false;

openBtn.addEventListener(
  "click",
  async ()=>{

    if(started) return;

    started=true;

    /* user tap unlocks audio */

    initAudio();

    if(
      audioCtx.state
      ===
      "suspended"
    ){

      await audioCtx.resume();

    }


    openBtn.style.display="none";


    /*
      Looks normal at first
    */

    introTitle.innerHTML=
      "FRIEND...";

    introText.innerHTML=
      "I HOPE YOU LIKE IT ♥";


    doubleHeartbeat();


    /*
      Something starts feeling wrong
    */

    setTimeout(()=>{

      introTitle.style.color=
        "#850000";

      introTitle.innerHTML=
        "WAIT...";

      introText.innerHTML=
        "DID YOU HEAR THAT?";

      drone();

    },1800);


    /*
      Enter room
    */

    setTimeout(()=>{

      intro.classList.add(
        "hide"
      );

      room.classList.add(
        "show"
      );

    },3900);


    /*
      Eyes
    */

    setTimeout(()=>{

      eyes.classList.add(
        "show"
      );

      doubleHeartbeat();

    },5300);


    /*
      Message
    */

    setTimeout(()=>{

      message.innerHTML=
        "DON'T LOOK AWAY";

      message.classList.add(
        "show"
      );

      heartbeatTimer =
        setInterval(
          doubleHeartbeat,
          850
        );

    },6600);


    /*
      Change message
    */

    setTimeout(()=>{

      message.innerHTML=
        "IT'S GETTING CLOSER";

    },8200);


    /*
      Countdown
    */

    setTimeout(()=>{

      clearInterval(
        heartbeatTimer
      );

      eyes.classList.remove(
        "show"
      );

      message.classList.remove(
        "show"
      );

      startCountdown();

    },9700);

  }
);


/* =========================
   COUNTDOWN 3 2 1
========================= */

function startCountdown(){

  count.classList.add(
    "show"
  );

  let number=3;

  showNumber(number);

  const timer =
    setInterval(()=>{

      number--;

      if(number>0){

        showNumber(number);

      }

      else{

        clearInterval(timer);

        /*
          1 disappears.

          Person expects the scare
          NOW...

          but nothing happens.
        */

        count.classList.remove(
          "show"
        );

        silence.classList.add(
          "show"
        );


        /*
          Fake calm pause.
          THEN surprise.
        */

        setTimeout(()=>{

          jumpscare();

        },1900);

      }

    },850);

}


function showNumber(n){

  count.innerHTML=n;

  count.classList.remove(
    "pop"
  );

  void count.offsetWidth;

  count.classList.add(
    "pop"
  );

  countSound();

}


/* =========================
   JUMPSCARE
========================= */

function jumpscare(){

  silence.classList.remove(
    "show"
  );

  scare.classList.add(
    "active"
  );

  flash.classList.add(
    "active"
  );

  scream();


  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      [
        130,
        60,
        130,
        60,
        250
      ]
    );

  }


  /*
    Finish joke
  */

  setTimeout(()=>{

    scare.classList.remove(
      "active"
    );

    end.classList.add(
      "show"
    );

  },1700);

}

</script>

</body>
</html>
